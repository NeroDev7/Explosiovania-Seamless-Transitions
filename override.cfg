[autoload]

ExplosiovaniaModLoader="*res://mods/mod_loader.gd"

[rendering]

; Seamless Transitions streams the next region while the current one is loaded. The game's default
; D3D12 renderer runs out of descriptor heaps with two regions loaded (Godot 4.5 limitation), so the
; mod switches the game to Vulkan. Delete these two lines to keep D3D12 (the mod then falls back to
; its simpler "swap" mode).
rendering_device/driver.windows="vulkan"
rendering_device/fallback_to_d3d12=true
