; Seamless Transitions settings. Edit with any text editor, restart the game to apply.

[transitions]
; "stream" = the next region is built in the background while you approach a gate (no stutter).
; "swap"   = simpler: the next region is loaded early, then swapped in when you touch the gate
;            (short hitch, hidden by a quick flash).
mode="stream"

; --- stream mode ---
; Start streaming the next region when you are this close to a region gate (meters).
stream_radius=80.0
; Time per frame spent building/adding the next region (milliseconds). Higher = ready sooner,
; lower = smoother. Your FPS drops a little while this runs.
stream_budget_ms=3.0
; When you cross, everything this close to you is switched on at once (meters);
; the rest of the region is switched on over the next frames.
wake_radius=40.0
wake_budget_ms=3.0
; Time per frame spent removing the region you left (milliseconds).
unload_budget_ms=3.0

; --- swap mode ---
; Start loading the next region when you are this close to a region gate (meters). 0 = off.
preload_radius=45.0
; Flash to hide the hitch while the new region is built (seconds). 0 = no flash.
fade_out_time=0.05
fade_in_time=0.25
fade_color=Color(1, 1, 1, 1)

; --- both modes ---
; "tinted" = region gate fog and floor glow take the destination region's color.
; "vanilla" = keep the original white region gates.
gate_style="tinted"
; How deep inside the exit doorway you appear (meters). Vanilla uses 9.4 and walks you out.
exit_depth=3.0
; Keep your speed, height, sideways offset and camera angle through the gate.
keep_momentum=true
; Upper limit for carried speed (vanilla clamps to 15 on each axis). 0 = no limit.
max_carried_speed=0.0
; Print timings to the game log (%APPDATA%/Godot/app_userdata/Explosiovania/logs).
debug_log=false
